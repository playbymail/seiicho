<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seiicho</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    form { display: grid; gap: 0.75rem; }
    label { display: grid; gap: 0.25rem; }
    input, button { font: inherit; padding: 0.4rem 0.6rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Seiicho</h1>
{{- if .Account }}
  <p>Welcome, {{ .Account.Email }}.</p>
  <form method="post" action="/logout">
    <button type="submit">Log out</button>
  </form>
{{- else }}
  <form method="post" action="/login">
    {{- if .Error }}
    <p class="error" role="alert">{{ .Error }}</p>
    {{- end }}
    <label>Email
      <input type="email" name="email" value="{{ .Email }}" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
{{- end }}
</body>
</html>

services:
  seiicho:
    # seiichodb create refuses an existing file, so only run it on a fresh orb;
    # otherwise migrate, because seiichod refuses an out-of-date schema.
    command: >-
      mkdir -p tmp &&
      if test -e "$SEIICHO_DB"; then go run ./cmd/seiichodb migrate; else go run ./cmd/seiichodb create; fi &&
      exec go run ./cmd/seiichod --addr "0.0.0.0:$PORT"
    env:
      SEIICHO_ENV: agent
      SEIICHO_DB: tmp/seiicho-agent.db
    health: /api/healthz
    portal:
      url: /
      title: Seiicho
      description: Opens the landing page. Sign in with POST /__agent/create-account/<email> and POST /__agent/log-me-in/<email>.
